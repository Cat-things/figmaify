name: Build

# Every push to main is built. Once main has 5 commits since the last
# release, the build is published as a new release. Pushing a vX.Y.Z tag
# by hand releases right away.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# Runs on main queue up, so two pushes can't both claim the same version.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: plan
        run: node scripts/release-plan.js

  windows:
    needs: plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      - name: Set release version
        if: needs.plan.outputs.release == 'true'
        run: npm version ${{ needs.plan.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Package
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: figmaify-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

  release:
    needs: [plan, windows]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: figmaify-windows
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Figmaify ${{ needs.plan.outputs.version }}
          body: ${{ needs.plan.outputs.notes }}
          make_latest: true
          files: |
            dist/*.exe
            dist/*.zip
